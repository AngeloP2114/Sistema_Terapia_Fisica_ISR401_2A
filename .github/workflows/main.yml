name: Calcular acuerdo doble codificacion

on:
  workflow_dispatch:

jobs:
  calcular:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar calculo de acuerdo
        run: python 10_Autoria/doble_codificacion/calcular_acuerdo.py

      - name: Mostrar resultados
        run: |
          cat 10_Autoria/doble_codificacion/resultado_acuerdo.csv
          echo ""
          cat 10_Autoria/doble_codificacion/desacuerdos.csv

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-doble-codificacion
          path: |
            10_Autoria/doble_codificacion/resultado_acuerdo.csv
            10_Autoria/doble_codificacion/resultado_acuerdo.md
            10_Autoria/doble_codificacion/desacuerdos.csv
